      directives:
        description: Install 7zip
      settings:
        id: 7zip.7zip
        source: winget
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: vlc
      directives:
        description: Install VLC
      settings:
        id: VideoLAN.VLC
        source: winget
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: gamesir
      directives:
        description: Gamesir Nexus
      settings:
        id: 9PMJKF5NSTDR
        source: msstore