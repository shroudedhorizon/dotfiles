      settings:
        id: Microsoft.DotNet.SDK.10
        source: winget
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: Brave
      directives:
        description: Install Brave
      settings:
        id: Brave.Brave
        source: winget
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: revouninstaller
      directives:
